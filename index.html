<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Tip calculator app</title>

  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <h1><span class="spli">SPLI</span><span class="TTER">TTER</span></h1>
  <div class="main-container">
    <div class="left-container">
      <div class="input-container">
        <div class="header-text">
          <p>Bill</p>
          <p id="bill-error-msg">Error!</p>
        </div>
        <label class="dollar-sign" for="bill">
          <input type="text" id="bill" name="bill">
        </label>
        <img class="dollar-sign-img" src="/images/icon-dollar.svg">
      </div>
      <div class="tip-container">
        <div class="header-text">
          <p class="tip-selection-label">Select Tip %</p>
          <p id="tip-selection-error-msg">test</p>
        </div>
        <form>
          <label class="tip-value" for="tip-percentage-5">
            <span>5%</span>
            <input type="radio" id="tip-percentage-5" name="tip-percentage" value="5%">
          </label>
          <label class="tip-value" for="tip-percentage-10"> 10%
            <input type="radio" id="tip-percentage-10" name="tip-percentage" value="10%">
          </label>
          <label class="tip-value" for="tip-percentage-15"> 15%
            <input type="radio" id="tip-percentage-15" name="tip-percentage" value="15%">
          </label>
          <label class="tip-value" for="tip-percentage-20"> 20%
            <input type="radio" id="tip-percentage-20" name="tip-percentage" value="20%">
          </label>
          <label class="tip-value" for="tip-percentage-50"> 50%
            <input type="radio" id="tip-percentage-50" name="tip-percentage" value="50%">
          </label>
          <label class="tip-value" for="custom-tip">
            <input id="custom-tip" type="text" name="tip-percentage" placeholder="Custom">
          </label>
        </form>
      </div>
      <div class="num-of-people-container">
        <div class="header-text">
          <p>Number of People</p>
          <p id="num-people-error-msg"></p>
        </div>
        <label class="num-of-people-label" for="num-of-people">
          <input type="text" id="num-of-people">
          <img class="person-img" src="/images/icon-person.svg">
        </label>
        </label>
      </div>
    </div>
    <div class="right-container">
      <div class="outer-container">
        <div class="tip-amount-container">
          <div class="headers">
            <h4>Tip Amount</h4>
            <h6>/ person</h6>
          </div>
          <p class="tip-counter">$0.00</p>
        </div>
        <div class="total-amount-container">
          <div class="headers">
            <h4>Total</h4>
            <h6>/ person</h6>
          </div>
          <p class="total-counter">$0.00</p>
        </div>
        <input type="button" id="reset-button" value="RESET">
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
