<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Tip calculator app</title>

  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <h1><span class="spli">SPLI</span><span class="TTER">TTER</span></h1>
  <div class="main-container">
    <div class="left-container">
      <div class="input-container">
        <label class="dollar-sign" for="bill">Bill</label>
        <input type="text" id="bill" name="bill">
        <span class="permanent-placeholder">$</span>
      </div>
      <label class="tip-selection-label">Select Tip %</label>
      <div class="tip-container">
        <form>
            <label class="tip-value" for="tip-percentage-5">
              <span>5%</span>
              <input type="radio" id="tip-percentage-5" name="tip-percentage" value="5%" checked>
            </label>
            <label class="tip-value" for="tip-percentage-10"> 10%
              <input type="radio" id="tip-percentage-10" name="tip-percentage" value="10%" checked>
            </label>
            <label class="tip-value" for="tip-percentage-15"> 15%
              <input type="radio" id="tip-percentage-15" name="tip-percentage" value="15%" checked>
            </label>
            <label class="tip-value" for="tip-percentage-20"> 20%
              <input type="radio" id="tip-percentage-20" name="tip-percentage" value="20%" checked>
            </label>
            <label class="tip-value" for="tip-percentage-50"> 50%
              <input type="radio" id="tip-percentage-50" name="tip-percentage" value="50%" checked>
            </label>
            <input class="tip-value" type="text" id="custom-tip" name="tip-percentage" placeholder="Custom">
        </form>
      </div>
    </div>
  </div>
</body>

</html>
